# DigitalOcean App Platform spec. Secrets are placeholders here and are filled from the gitignored .env.do by
# infra/render_spec.py at deploy time; App Platform stores them encrypted.
#   python3 infra/render_spec.py > /tmp/spec.yaml && doctl apps create --spec /tmp/spec.yaml   (first deploy)
#   python3 infra/render_spec.py > /tmp/spec.yaml && doctl apps update <app-id> --spec /tmp/spec.yaml
#
# Source: the public repo over HTTPS (no GitHub app integration needed). Deploys are triggered with
#   doctl apps create-deployment <app-id>   (there is no deploy-on-push with a plain git source).
#
# One domain for both components: /api and /health go to the backend, everything else to the frontend, so the
# session cookie is first-party without any proxying.
name: leaklens
region: blr
ingress:
  rules:
    - match: { path: { prefix: /api } }
      component: { name: api, preserve_path_prefix: true }
    - match: { path: { prefix: /health } }
      component: { name: api, preserve_path_prefix: true }
    - match: { path: { prefix: / } }
      component: { name: web }
services:
  - name: api
    git: { repo_clone_url: https://github.com/PradeepKundekar0101/leaklens.git, branch: main }
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_size_slug: apps-s-2vcpu-4gb
    instance_count: 1
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 6
    envs:
      - { key: APP_ENV, value: demo }
      - { key: DATABASE_URL, type: SECRET, value: "${DATABASE_URL}" }
      - { key: DATABASE_URL_DIRECT, type: SECRET, value: "${DATABASE_URL_DIRECT}" }
      - { key: DB_POOL_MODE, value: transaction }
      - { key: STORAGE_BACKEND, value: spaces }
      - { key: SPACES_ENDPOINT, value: "${SPACES_ENDPOINT}" }
      - { key: SPACES_REGION, value: "${SPACES_REGION}" }
      - { key: SPACES_BUCKET, value: "${SPACES_BUCKET}" }
      - { key: SPACES_KEY, type: SECRET, value: "${SPACES_KEY}" }
      - { key: SPACES_SECRET, type: SECRET, value: "${SPACES_SECRET}" }
      - { key: ANTHROPIC_API_KEY, type: SECRET, value: "${ANTHROPIC_API_KEY}" }
      - { key: ANTHROPIC_BASE_URL, value: https://api.anthropic.com }
      - { key: MODEL_REASONING, value: claude-sonnet-5-5 }
      - { key: MODEL_FAST, value: claude-haiku-5-5 }
      - { key: VOYAGE_API_KEY, type: SECRET, value: "${VOYAGE_API_KEY}" }
      - { key: EMBED_MODEL, value: voyage-3.5 }
      - { key: EMBED_DIMS, value: "1024" }
      - { key: LANGSMITH_API_KEY, type: SECRET, value: "${LANGSMITH_API_KEY}" }
      - { key: LANGSMITH_PROJECT, value: leaklens }
      - { key: LANGSMITH_TRACING, value: "true" }
      - { key: JWT_SECRET, type: SECRET, value: "${JWT_SECRET}" }
      - { key: JWT_EXPIRE_MINUTES, value: "480" }
      - { key: COOKIE_SECURE, value: "true" }
      - { key: CORS_ORIGINS, value: "${APP_URL}" }
      - { key: JOB_CONCURRENCY, value: "2" }
  - name: web
    git: { repo_clone_url: https://github.com/PradeepKundekar0101/leaklens.git, branch: main }
    source_dir: frontend
    environment_slug: node-js
    build_command: pnpm install --frozen-lockfile && pnpm build
    run_command: pnpm start --port 8080
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    git: { repo_clone_url: https://github.com/PradeepKundekar0101/leaklens.git, branch: main }
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: uv run --no-sync alembic upgrade head
    envs:
      # Migrations use the direct (not pooled) connection.
      - { key: DATABASE_URL, type: SECRET, value: "${DATABASE_URL_MIGRATE}" }
