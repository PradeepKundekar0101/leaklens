[project]
name = "leaklens-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.122",
    "docling>=2.145.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "joblib>=1.6.0",
    "langchain-anthropic>=1.7.7",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.16",
    "numpy>=2.5.4",
    "orjson>=3.13.0",
    "pandas>=3.1.0",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "reportlab>=5.1.0",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.6",
    "sse-starlette>=3.6.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["SIM105", "UP046"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["slow: long-running tests", "db: needs the test database"]
